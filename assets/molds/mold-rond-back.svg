<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
<!-- rond mold, back layer: shadow, outline, inner walls and floor of the empty mold. Opening = shape-rond-fill squashed to 0.55 about y 200; batter or cake goes between this and mold-rond-front -->
<defs><path id="p" d="M200 40 C288.4 40 360 111.6 360 200 C360 288.4 288.4 360 200 360 C111.6 360 40 288.4 40 200 C40 111.6 111.6 40 200 40 Z" transform="matrix(1 0 0 .55 0 90)"/><filter id="bl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="in" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cc482b"/><stop offset="1" stop-color="#94341f"/></linearGradient><linearGradient id="fl" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#eb5332"/><stop offset="1" stop-color="#b23f26"/></linearGradient><clipPath id="op"><use xlink:href="#p"/></clipPath></defs>
<use xlink:href="#p" y="82" fill="#0b4a70" stroke="#0b4a70" stroke-width="46" opacity=".3" filter="url(#bl)"/>
<g fill="#802d1b" stroke="#802d1b" stroke-linejoin="round"><g stroke-width="36"><use xlink:href="#p" y="74"/><use xlink:href="#p" y="72"/><use xlink:href="#p" y="70"/><use xlink:href="#p" y="68"/><use xlink:href="#p" y="66"/><use xlink:href="#p" y="64"/><use xlink:href="#p" y="62"/><use xlink:href="#p" y="60"/><use xlink:href="#p" y="58"/><use xlink:href="#p" y="56"/><use xlink:href="#p" y="54"/><use xlink:href="#p" y="52"/><use xlink:href="#p" y="50"/><use xlink:href="#p" y="48"/><use xlink:href="#p" y="46"/><use xlink:href="#p" y="44"/><use xlink:href="#p" y="42"/><use xlink:href="#p" y="40"/><use xlink:href="#p" y="38"/><use xlink:href="#p" y="36"/><use xlink:href="#p" y="34"/><use xlink:href="#p" y="32"/><use xlink:href="#p" y="30"/><use xlink:href="#p" y="28"/><use xlink:href="#p" y="26"/><use xlink:href="#p" y="24"/><use xlink:href="#p" y="22"/><use xlink:href="#p" y="20"/><use xlink:href="#p" y="18"/><use xlink:href="#p" y="16"/><use xlink:href="#p" y="14"/><use xlink:href="#p" y="12"/><use xlink:href="#p" y="10"/></g><g stroke-width="46"><use xlink:href="#p" y="10"/><use xlink:href="#p" y="8"/><use xlink:href="#p" y="6"/><use xlink:href="#p" y="4"/><use xlink:href="#p" y="2"/><use xlink:href="#p" y="0"/></g></g>
<use xlink:href="#p" fill="url(#in)" stroke="url(#in)" stroke-width="6"/>
