<use xlink:href="#p" y="64" fill="none" stroke="#802d1b" stroke-opacity=".35" stroke-width="5"/>
<use xlink:href="#p" y="5" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="12"/></g>
</svg>
