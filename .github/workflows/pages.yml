# Publishes the collection on GitHub Pages at every push to master (and on demand).
# Only the site files are published: nothing from docs/, tests/, .superpowers/ or package.json.
name: Publier le site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R shared jeux vendor _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
