<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300" width="300" height="300">
<!-- eyes, open: separate layer so they can blink alone; eye line y 128, eye centres x 114 and 186; works on client-head and client-animal-* -->
<defs><radialGradient id="e" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#8a5a3a"/><stop offset="1" stop-color="#2b1608"/></radialGradient></defs>
<g fill="#fff" stroke="#5a2a10" stroke-opacity=".45" stroke-width="2"><ellipse cx="114" cy="128" rx="17" ry="19"/><ellipse cx="186" cy="128" rx="17" ry="19"/></g>
<g fill="url(#e)"><circle cx="116" cy="130" r="12"/><circle cx="184" cy="130" r="12"/></g>
<g fill="#fff"><circle cx="121" cy="124" r="4.5"/><circle cx="189" cy="124" r="4.5"/><circle cx="112" cy="135" r="2"/><circle cx="180" cy="135" r="2"/></g>
</svg>
