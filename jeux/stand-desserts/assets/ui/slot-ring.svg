<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96" width="96" height="96">
<!-- one empty topping slot: dotted ring r 40 about 48,48 (12 white dashes with a dark edge, faint white disc). White, so a tint recolours the dashes -->
<circle cx="48" cy="48" r="40" fill="#fff" opacity=".28"/>
<circle cx="48" cy="48" r="40" fill="none" stroke="#3b2a55" stroke-width="10" stroke-linecap="round" stroke-dasharray="8.50 12.44" opacity=".5" transform="rotate(-11 48 48)"/>
<circle cx="48" cy="48" r="40" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="8.50 12.44" transform="rotate(-11 48 48)"/>
</svg>
