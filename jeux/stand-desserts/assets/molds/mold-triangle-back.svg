<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
<!-- triangle mold, back layer: shadow, outline, inner walls and floor of the empty mold. Opening = shape-triangle-fill squashed to 0.55 about y 200; batter or cake goes between this and mold-triangle-front -->
