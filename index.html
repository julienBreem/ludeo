<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4fc3f7">
<link rel="icon" href="shared/icons/icon-192.png">
<link rel="stylesheet" href="shared/home.css">
<title>Jeux</title>
</head>
<body>
<!-- The child's home: no text. Built by shared/home.js. -->
<main id="home">
  <div id="moon" class="art" hidden></div>
  <div id="avatar" class="art-fallback"><canvas width="240" height="240"></canvas></div>
  <button id="gear" type="button" aria-label="Espace parent"><i class="dot" hidden></i></button>
  <div id="tiles"></div>
</main>
<div id="parent" hidden></div>
<script type="module" src="shared/home.js"></script>
<script>
  // Offline play: relative path so it works from a sub-folder or sub-domain.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { type: 'module' }).catch(() => {});
    });
  }
</script>
</body>
</html>
